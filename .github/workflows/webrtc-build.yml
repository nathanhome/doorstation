name: WebRTC library build for arm64

on:
  workflow_dispatch:
    inputs:
      # see https://chromiumdash.appspot.com/branches for latest stables
      webrtc_stable_release:
        type: choice
        description: 'WebRTC stable release'
        required: true
        options:
        - "m139"
        # - "m135"
        default: 'm139'

env:
  # translation of supported webrtc stable releases to branches
  m131: "6778" 
  m135: "7049"
  m139: "7204"
  WEBRTC_RELEASE: ${{ github.event.inputs.webrtc_stable_release }}
  PACKAGE_NAME: "libwebrtc-arm64-dev"
  PACKAGE_VERSION: "1.0.0"

jobs:
  build-webrtc-arm64:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - run: |
          # map release to stable branch 
          echo "WEBRTC_BRANCH=${!WEBRTC_RELEASE}" >> $GITHUB_ENV
          # packaging
          echo "PACKAGE_VERSION=${{ env.PACKAGE_VERSION }}-${{ env.WEBRTC_RELEASE }}" >> $GITHUB_ENV
          echo "PACKAGE_TAG=webrtc-v${{ env.PACKAGE_VERSION }}-${{ env.WEBRTC_RELEASE }}" >> $GITHUB_ENV
          echo "PACKAGE_FULLNAME=${{ env.PACKAGE_NAME }}_${{ env.PACKAGE_VERSION }}-${{ env.WEBRTC_RELEASE }}" >> $GITHUB_ENV

      - name: Aggressive cleanup
        run: |
          echo "=== Removing large directories ==="
          # Remove Android SDK (huge)
          sudo rm -rf /usr/local/lib/android || true        
          # Remove .NET
          sudo rm -rf /usr/share/dotnet || true
          # Remove Haskell
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h

      - name: Minimal toolset
        run: |
          echo "=== Installing minimal dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python-is-python3 \
            curl \
            wget \
            build-essential \
            pkg-config \
            lsb-release
          df -h

      - name: Cache depot_tools
        uses: actions/cache@v3
        with:
          path: $HOME/depot_tools
          key: depot-tools-${{ runner.os }}-v2

      - name: Install depot_tools
        run: |
          cd $HOME
          if [[ ! -d "depot_tools" ]]; then
            echo "=== Installing depot_tools ==="
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git --depth 1
          fi
          # Add depot_tools to PATH
          export PATH="$HOME/depot_tools:$PATH"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch webrtc
        run: |
          mkdir -p /tmp/webrtc_build
          cd /tmp/webrtc_build
          git config --global user.name "doorstation"
          git config --global user.email "doorstation@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global fetch.recurseSubmodules false
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          if [[ ! -d "src" ]]; then
            echo "=== Fetching WebRTC source ==="
            fetch --nohooks webrtc
          fi
      
      - name: Switch to stable branch
        run: |
          echo "=== Checkout ${{ env.WEBRTC_BRANCH }} ==="
          cd /tmp/webrtc_build/src
          git checkout -b branch_${{ env.WEBRTC_BRANCH }} branch-heads/${{ env.WEBRTC_BRANCH }}
          gclient sync --with_branch_heads --with_tags

      - name: Activate arm64 sysroot
        id: arm64-sysroot
        run: |
          echo "=== Setting up arm64 sysroot ==="
          cd /tmp/webrtc_build/src
          # First, you have to install the packages for the base platform
          ./build/install-build-deps.sh --no-prompt
          gclient runhooks
          # Second, the equivalent arm packages are installed with sysroot
          # other sequence always only installs i386
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
          # Find the installed sysroot
          SYSROOT_PATH=$(find build/linux -name "*arm64*sysroot" -type d | head -1)
          echo "Installed sysroot: $SYSROOT_PATH"
          echo "SYSROOT_PATH=${SYSROOT_PATH}" >> $GITHUB_ENV


      - name: Compile for arm64
        id: cross-compile
        run: |
          echo "=== Cross-compiling WebRTC for arm64 ==="
          cd /tmp/webrtc_build/src
          mkdir -p out/arm64
          gn gen out/arm64 --args="is_clang=true use_system_clang=false clang_use_chrome_plugins=false
            use_lld=true target_os=\"linux\" target_cpu=\"arm64\" use_sysroot=true 
            is_debug=false enable_iterator_debugging=false is_component_build=false
            treat_warnings_as_errors=false use_custom_libcxx=false
            rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false
            rtc_use_pipewire=false rtc_enable_protobuf=true rtc_enable_libevent=false 
            rtc_use_x11=false rtc_use_h264=true"
            extra_cxxflags=[\"-std=c++17\"]
            # rtc_build_ssl=false rtc_ssl_root=\"${SYSROOT_PATH}/usr\"
          ninja -C out/arm64 -j$(nproc)

      - name: Package .deb
        id: package-deb
        run: |
          echo "=== Create .deb package ==="
          cd /tmp/webrtc_build/src
          PACKAGE_DIR="out/arm64/${PACKAGE_FULL_NAME}"

          # add libraries
          mkdir -p "${PACKAGE_DIR}/usr/lib/aarch64-linux-gnu"
          cp out/arm64/obj/libwebrtc.a ${PACKAGE_DIR}/usr/lib/aarch64-linux-gnu

          # free some space from compilation for header copy
          rm -rf out/arm64/obj

          # add essential includes
          mkdir -p "${PACKAGE_DIR}/usr/include/webrtc"
          cp -r api ${PACKAGE_DIR}/usr/include/webrtc 2>/dev/null || echo "api headers not found"
          cp -r rtc_base ${PACKAGE_DIR}/usr/include/webrtc 2>/dev/null || echo "rtc_base headers not found"

          # add deb package control file
          mkdir -p "${PACKAGE_DIR}/DEBIAN"
          cat >${PACKAGE_DIR}/DEBIAN/control <<EOC
          Package: ${PACKAGE_NAME}
          Version: ${PACKAGE_VERSION}
          Architecture: arm64
          Maintainer: WebRTC Build Bot <nathanhome@users.noreply.github.com>
          Description: WebRTC development libraries for ARM64 (Raspi 3+)
           WebRTC (Web Real-Time Communication) is a collection of standards, protocols,
           and APIs that enable real-time peer-to-peer communication of audio, video,
           and data in web browsers and mobile applications.
           .
           This package contains the static libraries and header files for developing
           applications with WebRTC on ARM64 architecture e.g. for raspberry pis 3+ or newer.
          Section: libdevel
          Priority: optional
          Depends: libc6, libstdc++6
          Homepage: https://webrtc.org/
          EOC          

          # add license (from webrtc original)
          mkdir -p ${PACKAGE_DIR}/usr/share/doc/${PACKAGE_NAME}
          cat >${PACKAGE_DIR}/usr/share/doc/${PACKAGE_NAME}/copyright <<EOC
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: WebRTC
          Source: https://webrtc.googlesource.com/src
          
          Files: *
          Copyright: 2011-2024 The WebRTC project authors
          License: BSD-3-Clause
          
          License: BSD-3-Clause
           Redistribution and use in source and binary forms, with or without
           modification, are permitted provided that the following conditions are met:
           .
           1. Redistributions of source code must retain the above copyright notice,
              this list of conditions and the following disclaimer.
           .
           2. Redistributions in binary form must reproduce the above copyright notice,
              this list of conditions and the following disclaimer in the documentation
              and/or other materials provided with the distribution.
           .
           3. Neither the name of the copyright holder nor the names of its contributors
              may be used to endorse or promote products derived from this software
              without specific prior written permission.
          EOC

          # Minimal changelog with reference to webrtc change history
          ls -alF ${PACKAGE_DIR}/usr/share/doc/${PACKAGE_NAME}

          cat >${PACKAGE_DIR}/usr/share/doc/${PACKAGE_NAME}/changelog.Debian <<EOC
          ${PACKAGE_NAME} (${PACKAGE_VERSION}) bookworm; urgency=medium
          
            * WebRTC build for release ${{ env.WEBRTC_RELEASE }} => (branch ${{ env.WEBRTC_BRANCH }})
              see https://chromiumdash.appspot.com/branches for release/branch association
            * Cross-compiled for ARM64 architecture
            * minimal features required for a server/device webrtc application
            * BoringSSL for secure messaging
            * [Release details](https://webrtc.googlesource.com/src.git/+log/refs/branch-heads/${{ env.WEBRTC_BRANCH }}/)
          
           -- WebRTC Build Bot <nathanhome@users.noreply.github.com>  $(date -R)
          EOC
          gzip -9 "${PACKAGE_DIR}/usr/share/doc/${PACKAGE_NAME}/changelog.Debian"

          # build .deb package
          cd out/arm64
          dpkg-deb --root-owner-group --build "${PACKAGE_FULLNAME}"
          
          # verify the package
          dpkg-deb --info "${PACKAGE_FULLNAME}.deb"

      - name: create-release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ env.PACKAGE_TAG }}"
          name: "WebRTC ${{ env.WEBRTC_RELEASE }} ARM64 (.deb)"
          body: |
            WebRTC ${{ env.WEBRTC_RELEASE }} compiled for ARM64 architecture.
            
            **Direct installation:**
            Download and install the .deb package directly:
            ```bash
            sudo dpkg -i ${{ env.PACKAGE_FULLNAME }}.deb
            sudo apt-get install -f  # Fix any dependency issues
            ```
            
            **APT repository installation:**
            This package will be added to the APT repository automatically.
            See the main repository README for APT installation instructions.
            
            **Build Info:**
            - WebRTC Release: ${{ env.WEBRTC_RELEASE }}
            - Branch: ${{ env.WEBRTC_BRANCH }}
            - Architecture: ARM64
            - Target: Debian Bookworm
            - Built: $(date)
          files: |
            /tmp/webrtc_build/src/out/arm64/${{ env.PACKAGE_FULLNAME }}.deb
          draft: false
          prerelease: false
