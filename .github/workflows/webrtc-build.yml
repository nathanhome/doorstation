name: WebRTC library build for arm64

on:
  workflow_dispatch:
    inputs:
      webrtc_stable_release:
        description: 'WebRTC stable release'
        required: true
        # see https://chromiumdash.appspot.com/branches for latest stables
        options:  
        - "m131"
        - "m135"
        - "m139"
        default: 'm135'
      # clang_version:
      #  description: 'LLVM major version'
      #  required: true
      #  default: '19'

env:
  # translation of supported webrtc stable releases to branches
  m131: "6778" 
  m135: "7049"
  m139: "7204"
  WEBRTC_RELEASE: ${{ github.event.inputs.webrtc_stable_release }}

jobs:
  build-webrtc-arm64:
    runs-on: ubuntu-24.04

    permissions:
      packages: read  # Needed to pull from GHCR

    steps:
      - uses: actions/checkout@v4

      # map release to stable branch 
      - run: |
          echo "WEBRTC_BRANCH=${!WEBRTC_RELEASE}" >> $GITHUB_ENV

      - name: Aggressive cleanup
        run: |
          echo "=== Removing large directories ==="
          # Remove Android SDK (huge)
          sudo rm -rf /usr/local/lib/android || true        
          # Remove .NET
          sudo rm -rf /usr/share/dotnet || true
          # Remove Haskell
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h

      - name: Minimal toolset
        run: |
          echo "=== Installing minimal dependencies ==="
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python-is-python3 \
            curl \
            wget \
            build-essential \
            pkg-config \
            lsb-release
          df -h

      - name: Cache depot_tools
        uses: actions/cache@v3
        with:
          path: $HOME/depot_tools
          key: depot-tools-${{ runner.os }}-v2

      - name: Install depot_tools
        run: |
          cd $HOME
          if [[ ! -d "depot_tools" ]]; then
            echo "=== Installing depot_tools ==="
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git --depth 1
          fi
          # Add depot_tools to PATH
          export PATH="$HOME/depot_tools:$PATH"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch webrtc
        run: |
          mkdir -p /tmp/webrtc_build
          cd /tmp/webrtc_build
          git config --global user.name "doorstation"
          git config --global user.email "doorstation@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global fetch.recurseSubmodules false
          git config --global http.postBuffer 1048576000
          git config --global core.compression 0
          if [[ ! -d "src" ]]; then
            echo "=== Fetching WebRTC source ==="
            fetch --nohooks webrtc
          fi
      
      - name: Switch to stable branch
        run: |
          echo "=== Checkout ${{ env.WEBRTC_BRANCH }} ==="
          cd /tmp/webrtc_build/src
          git checkout -b branch_${{ env.WEBRTC_BRANCH }} branch-heads/${{ env.WEBRTC_BRANCH }}
          gclient sync --with_branch_heads --with_tags

      - name: arm64 sysroot
        run: |
          echo "=== Setting up arm64 sysroot ==="
          cd /tmp/webrtc_build/src
          # First, you have to install the packages for the base platform
          ./build/install-build-deps.sh --no-prompt
          gclient runhooks
          # Second, the equivalent arm packages are installed with sysroot
          # other sequence always only installs i386
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64 --distro=debian_bookworm
          # Set environment for target architecture
          export GN_DEFINES="target_os=linux target_cpu=arm64"
          echo "GN_DEFINES=target_os=linux target_cpu=arm64" >> $GITHUB_ENV

      - name: cross-compile
        run: |
          echo "=== Cross-compiling WebRTC for arm64 ==="
          cd /tmp/webrtc_build/src
          mkdir -p out/arm64
          gn gen out/arm64 --args="is_clang=true use_system_clang=false clang_use_chrome_plugins=false
            use_lld=true target_os=\"linux\" target_cpu=\"arm64\" use_sysroot=true 
            is_debug=false enable_iterator_debugging=false is_component_build=false
            treat_warnings_as_errors=false use_custom_libcxx=false
            rtc_include_tests=false rtc_build_examples=false rtc_build_tools=false
            rtc_use_pipewire=false rtc_enable_protobuf=true rtc_enable_libevent=false 
            rtc_use_x11=false rtc_use_h264=true"
            # rtc_build_ssl=true rtc_ssl_root=\"/usr/include/openssl\"

          ninja -C out/arm64 -j$(nproc)

      - name: pack-webrtc
        run: |
          cd /tmp/webrtc_build/src
        
          # add webrtc library in lib
          mkdir -p out/webrtc-arm64-build/lib
          cp out/arm64/obj/libwebrtc.a out/webrtc-arm64-build/lib/
          rm -rf out/arm64/obj

          # add essential includes
          mkdir -p webrtc-arm64-build/include
          cp -r api webrtc-arm64-build/include/ 2>/dev/null || echo "api headers not found"
          cp -r rtc_base webrtc-arm64-build/include/ 2>/dev/null || echo "rtc_base headers not found"
        
          # Create a build info
          cat > out/webrtc-arm64-build/BUILD_INFO.txt << EOF
          WebRTC ARM64 Build - $(date)
          Release: ${{ env.WEBRTC_RELEASE }}
          Branch: ${{ env.WEBRTC_BRANCH }}
          Clang: TODO
          Target: ARM64 Linux + BoringSSL
        
          Libraries: $(ls out/webrtc-arm64-build/lib/ | wc -l) files
          Size: $(du -sh out/webrtc-arm64-build/lib/ | cut -f1)
          EOF
        
          # compressed tarball
          tar -czf out/webrtc-arm64-${{ env.WEBRTC_RELEASE }}.tar.gz out/webrtc-arm64-build/

          echo "=== Package info ==="
          ls -lah out/webrtc-arm64-*.tar.gz
          echo "Libraries included:"
          ls -la webrtc-arm64-build/lib/
        
        
      # Using GitHub Package Registry Generic Packages API
      - name: Upload to GitHub Package Registry
        run: |
          cd /tmp/webrtc_build/src/out       
          curl -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @webrtc-arm64-${{ env.WEBRTC_RELEASE }}.tar.gz \
            "https://uploads.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/packages/generic/webrtc-arm64/${{ env.WEBRTC_RELEASE }}/webrtc-arm64-${{ env.WEBRTC_RELEASE }}.tar.gz"        
